# CI for the KVD spec repo: ensure every example in the spec parses with kvd-rs.

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  spec-drift:
    runs-on: ubuntu-latest
    container:
      image: rust:1-trixie
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache cargo registry and target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Test (spec examples parse against kvd-rs)
        run: cargo test
