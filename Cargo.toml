[package]
name = "kvd-spec"
version = "1.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false
repository = "https://github.com/key-value-document/kvd-spec"

[dev-dependencies]
# Path for now: `'''` multi-line literals (spec §1.1) need kvd-rs 1.2.0, which
# is not published yet. Drop `path` once 1.2.0 is on crates.io, otherwise CI
# has no sibling checkout to resolve.
kvd-rs = { version = "1.2.0", path = "../kvd-rs" }
